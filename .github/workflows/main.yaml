name: PROOV Backend CI/CD (Docker)

on:
    push:
        branches: ["dev"] # 현재 main 브렌치 말고 dev 브렌치에 push 시에만 실행

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Docker Hub 로그인
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: 이미지 빌드 및 푸시
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  # 브랜치별로 태그 구분 (dev / latest)
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/proov-backend:${{ github.ref_name }}
                      ${{ secrets.DOCKER_USERNAME }}/proov-backend:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: EC2 접속 및 컨테이너 갱신
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ github.ref == 'refs/heads/main' && secrets.PROD_HOST || secrets.DEV_HOST }}
                  username: ubuntu
                  key: ${{ secrets.DEV_SSH_KEY }}
                  script: |
                      # 1. 최신 이미지 받아오기
                      docker pull ${{ secrets.DOCKER_USERNAME }}/proov-backend:latest

                      # 2. 기존 컨테이너 중지 및 삭제
                      docker rm -f proov-app || true

                      # ✨ 중요: 여기에 새로 만든 변수들을 다 넣어줘야 합니다! ✨
                      # 3. 새 이미지로 컨테이너 실행 (환경 변수 모두 주입)
                      docker run -d \
                        -p 5002:5002 \
                        --name proov-app \
                        -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                        -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
                        -e JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
                        -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
                        -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
                        -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
                        -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
                        -e GITHUB_CLIENT_ID="${{ secrets.GH_CLIENT_ID }}" \
                        -e GITHUB_CLIENT_SECRET="${{ secrets.GH_CLIENT_SECRET }}" \
                        ${{ secrets.DOCKER_USERNAME }}/proov-backend:latest

                      # 4. DB 테이블 최신화
                      docker exec -T proov-app npx prisma migrate deploy

                      # 5. 불필요한 이미지 정리
                      docker image prune -f
