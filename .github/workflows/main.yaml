name: PROOV Backend CD (Docker)

on:
  push:
    branches: [ "dev", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 브랜치별로 태그 구분 (dev / latest)
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/proov-backend:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/proov-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2 접속 및 컨테이너 갱신
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.PROD_HOST || secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            # 1. 최신 이미지 받아오기
            docker pull ${{ secrets.DOCKER_USERNAME }}/proov-backend:latest
            
            # 2. 기존 컨테이너 중지 및 삭제
            docker rm -f proov-app || true
            
            # 3. 새 이미지로 컨테이너 실행
            docker run -d \
              -p 5000:5000 \
              --name proov-app \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ${{ secrets.DOCKER_USERNAME }}/proov-backend:latest
            
            # 4. 안 쓰는 이미지 정리 (용량 확보)
            docker image prune -f